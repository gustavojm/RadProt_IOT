<html>

<head>
    <title>Radioprotección</title>
    <style type="text/css">

    </style>
    <script language="JavaScript">

        function apply_settings() {
            let xhr = new XMLHttpRequest();
            xhr.open("POST", '/settings.cgi', true);
            xhr.setRequestHeader("Content-Type", "application/json");
            json = JSON.stringify(Object.fromEntries(new FormData(document.getElementById("settings_form"))));
            xhr.send(json);
            xhr.onloadend = function () {
                if (this.responseText == "OK") {
                    document.getElementById("reboot_popup").style.display = "block";
                    unrecoverable_error = "rebooting";
                } else {
                    alert(this.responseText);
                }
            };  
        }
    </script>
</head>

<body>
    <a href="admin.html"  class="btn btn--s">&lt;</a>&nbsp;&nbsp;<strong>Network Configuration</strong>
    <hr>
    Connect to Router with these settings:<br>
    <form action="" method="get">
    <table border="0"  cellspacing="0" cellpadding="3" style="width:310px" >
    <tr><td align="right">SSID:</td><td><input type="text" id="ssid" name="ssid" value=""></td></tr>
    <tr><td align="right">Password:</td><td><input type="text" id="password" name="password" value=""></td></tr>
    <tr><td align="right">DHCP:</td><td><input type="checkbox" id="dhcp" name="dhcp"></td></tr>
    <tr><td align="right">IP:     </td><td><input type="text" id="ip_0" name="ip_0" size="3">.<input type="text" id="ip_1" name="ip_1" size="3">.<input type="text" id="ip_2" name="ip_2" size="3">.<input type="text" id="ip_3" name="ip_3" value="" size="3"></td></tr>
    <tr><td align="right">Netmask:</td><td><input type="text" id="nm_0" name="nm_0" size="3">.<input type="text" id="nm_1" name="nm_1" size="3">.<input type="text" id="nm_2" name="nm_2" size="3">.<input type="text" id="nm_3" name="nm_3" size="3"></td></tr>
    <tr><td align="right">Gateway:</td><td><input type="text" id="gw_0" name="gw_0" size="3">.<input type="text" id="gw_1" name="gw_1" size="3">.<input type="text" id="gw_2" name="gw_2" size="3">.<input type="text" id="gw_3" name="gw_3" size="3"></td></tr>
    <tr><td colspan="2" align="center"><input disabled id="save" type="submit" style="width:150px" class="btn btn--m btn--blue" value="Save"></td></tr>
    </table>
    </form>
    <hr>
    <strong>Connection State:</strong><div id="connectionstate">N/A</div>
    <hr>
    <strong>Networks:</strong><br>
    <table id="wifiTable">
        <thead>
            <tr>
                <th>#</th>
                <th>SSID</th>
                <th>RSSI</th>
                <th>Channel</th>
                <th>BSSID</th>
                <th>Security</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <script>

        function getWifiSignalBars(rssi) {
            if (rssi >= -30) {
                return "▆ ▆ ▆ ▆ ▆";
            } else if (rssi >= -50) {
                return "▆ ▆ ▆ ▆";
            } else if (rssi >= -60) {
                return "▆ ▆ ▆";
            } else if (rssi >= -70) {
                return "▆ ▆";
            } else {
                return "▆";
            }
        }

        function getAuthModeText(mode) {
            switch (mode) {           
                case 0:
                    return "OPEN"
                    break;

                case 1:
                    return "WPA TKIP PSK"
                    break;
                    
                case 2:
                    return "WPA AES PSK"
                    break;

                case 3:
                    return "WPA2/WPA MIXED PSK"
                    break;
                    
                case 4:
                    return "WPA3 AES"
                    break;

                case 5:
                    return "WPA2/WPA3"
                    break;


                default:
                    break;
            }

        }

        const networks_string = '\
        {"WIFI_NETS":[{"ssid":"CNE_ICI","rssi":-65,"chann":11, "auth_mode":0,"bssid":"00:6b:f1:c0:94:61"},\
        {"ssid":"CNE_Dosimetria","rssi":-50,"chann":11, "auth_mode":0, "bssid":"00:6b:f1:c0:94:62"},\
        {"ssid":"CNE_Telefonia","rssi":-53,"chann":11, "auth_mode":2, "bssid":"00:6b:f1:c0:94:63"},\
        {"ssid":"CNE_CDP","rssi":-91,"chann":11, "auth_mode":3, "bssid":"00:6b:f1:c0:94:66"},\
        {"ssid":"CNE_Radioproteccion","rssi":-10,"chann":11, "auth_mode":3, "bssid":"00:6b:f1:c0:94:68"},\
        {"ssid":"CNE_Internet","rssi":-51,"chann":11,"auth_mode":3, "bssid":"00:6b:f1:c0:94:6b"},\
        {"ssid":"C14017750 7261","rssi":-39,"chann":6, "auth_mode":3, "bssid":"c6:03:a8:e6:d6:33"}]}';

        const networks_json = JSON.parse(networks_string);
        const tableBody = document.querySelector("#wifiTable tbody");

        networks_json.WIFI_NETS.forEach((item, index) => {
            const row = document.createElement("tr");

            row.innerHTML = `
                <td>${index + 1}</td>
                <td><a href='javascript:selssid("${item.ssid}")'>${item.ssid}</a></td>
                <td style="color: green;">${getWifiSignalBars(item.rssi)}</td>
                <td>${item.chann}</td>
                <td>${item.bssid}</td>
                <td>${getAuthModeText(item.auth_mode)}</td>
            `;

            tableBody.appendChild(row);
        });
    </script>
    </table>
    
    <script>
    
    function selssid(value){
        document.getElementById("ssid").value = value; 
      }
    
    window.onload = function () {
      
        load("style.css","css", function() {
            load("microajax.js","js", function() {
            setValues("/admin/values");
          document.getElementById("save").disabled = false; 
                setTimeout(GetState,3000);
              });
          });
      }
      
    function load(e,t,n){
      if("js"==t){
          var a=document.createElement("script");
          a.src=e,a.type="text/javascript",a.async=!1,a.onload=function(){n()},document.getElementsByTagName("head")[0].appendChild(a)
          }
       else if("css"==t){
        var a=document.createElement("link");
        a.href=e,a.rel="stylesheet",a.type="text/css",a.async=!1,a.onload=function(){n()},document.getElementsByTagName("head")[0].appendChild(a)
        }
      }
    </script>

    <div>
        <h1><!--#MACAddr--></h1>

        <form id="settings_form">
        <table>
            <thead>
                <tr>
                    <td>Setting</td>
                    <td>Value</td>
                </tr>
            </thead>
            <tr>
                <td>Nombre de Red:</td>
                <td><input type="text" name="ssid"></td>
            </tr>
            <tr>
                <td>Usuario:</td>
                <td><input type="text" name="wifi_user"></td>
            </tr>
            <tr>
                <td>Contrase&ntilde;a:</td>
                <td><input type="text" name="wifi_pass"></td>
            </tr>
            <tr>
                <td>Seguridad:</td>
                <td>
                    <select name="wifi_seq">
                        <option value="OPEN" title="No authorisation required (open)">OPEN</option>
                        <option value="WPA_TKIP_PSK" title="WPA authorisation">WPA TKIP PSK</option>
                        <option value="WPA2_AES_PSK" title="WPA2 authorisation (prefered)">WPA AES PSK</option>
                        <option value="WPA2_MIXED_PSK" title="WPA2/WPA mixed authorisation" selected>WPA2/WPA MIXED PSK</option>
                        <option value="WPA3_SAE_AES_PSK" title="WPA3 AES authorisation">WPA3 AES</option>
                        <option value="WPA3_WPA2_AES_PSK" title="WPA3 AES authorisation">WPA2/WPA3</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>
                    <input type="button" onclick="apply_settings()" value="Guardar Config">
                    <!-- <button onclick="show_settings_popup(false)">Cancel</button> -->
                </td>
            </tr>
        </table>
        </form>
        
    </div>
</body>

</html>
