<html>

<head>
    <title>Radioprotección</title>
    <style type="text/css">

    </style>
    <script language="JavaScript">

        function apply_settings() {
            let xhr = new XMLHttpRequest();
            xhr.open("POST", '/settings.cgi', true);
            xhr.setRequestHeader("Content-Type", "application/json");
            json = JSON.stringify(Object.fromEntries(new FormData(document.getElementById("settings_form"))));
            xhr.send(json);
            xhr.onloadend = function () {
                if (this.responseText == "OK") {
                    document.getElementById("reboot_popup").style.display = "block";
                    unrecoverable_error = "rebooting";
                } else {
                    alert(this.responseText);
                }
            };  
        }
    </script>
</head>

<body>
    <div>
        <h1><!--#MACAddr--></h1>

        <form id="settings_form">
        <table>
            <thead>
                <tr>
                    <td>Setting</td>
                    <td>Value</td>
                </tr>
            </thead>
            <tr>
                <td>Nombre de Red:</td>
                <td><input type="text" name="ssid"></td>
            </tr>
            <tr>
                <td>Usuario:</td>
                <td><input type="text" name="wifi_user"></td>
            </tr>
            <tr>
                <td>Contrase&ntilde;a:</td>
                <td><input type="text" name="wifi_pass"></td>
            </tr>
            <tr>
                <td>Seguridad:</td>
                <td>
                    <select name="wifi_seq">
                        <option value="OPEN" title="No authorisation required (open)">Open</option>
                        <option value="WPA_TKIP_PSK" title="WPA authorisation">WPA TKIP PSK</option>
                        <option value="WPA2_AES_PSK" title="WPA2 authorisation (prefered)">WPA AES PSK</option>
                        <option value="WPA2_MIXED_PSK" title="WPA2/WPA mixed authorisation" selected>WPA2/WPA MIXED PSK</option>
                        <option value="WPA3_SAE_AES_PSK" title="WPA3 AES authorisation">WPA3 AES</option>
                        <option value="WPA3_WPA2_AES_PSK" title="WPA3 AES authorisation">WPA2/WPA3</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>
                    <input type="button" onclick="apply_settings()" value="Guardar Config">
                    <!-- <button onclick="show_settings_popup(false)">Cancel</button> -->
                </td>
            </tr>
        </table>
        </form>
        
    </div>
</body>

</html>
